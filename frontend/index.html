<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>LoanTrack</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        form {
            display: grid;
            gap: 12px;
        }

        input,
        select,
        button {
            padding: 10px;
            font-size: 15px;
        }

        button {
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border-bottom: 1px solid #ddd;
            text-align: left;
            padding: 10px;
        }

        .message {
            margin-top: 10px;
            min-height: 20px;
        }
    </style>
</head>

<body>
    <h1>LoanTrack</h1>

    <p class="subtitle">
        Loan management demo application
    </p>

    <section class="card">
        <h2>Add Loan</h2>

        <form id="loan-form">
            <input
                id="borrower_name"
                type="text"
                placeholder="Borrower name"
                required
            >

            <input
                id="loan_amount"
                type="number"
                step="0.01"
                min="0.01"
                placeholder="Loan amount"
                required
            >

            <input
                id="property_city"
                type="text"
                placeholder="Property city"
            >

            <select id="status">
                <option value="PENDING">PENDING</option>
                <option value="UNDER_REVIEW">UNDER_REVIEW</option>
                <option value="APPROVED">APPROVED</option>
                <option value="REJECTED">REJECTED</option>
            </select>

            <button type="submit">
                Add Loan
            </button>
        </form>

        <div id="message" class="message"></div>
    </section>

    <section class="card">
        <h2>Loans</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Borrower</th>
                    <th>Amount</th>
                    <th>City</th>
                    <th>Status</th>
                    <th>Backend</th>
                </tr>
            </thead>

            <tbody id="loan-table-body">
            </tbody>
        </table>
    </section>

    <script>
        const API_BASE_URL = "http://localhost:8000";

        const form = document.getElementById("loan-form");
        const tableBody = document.getElementById("loan-table-body");
        const message = document.getElementById("message");

        async function loadLoans() {
            try {
                const response = await fetch(`${API_BASE_URL}/loans`);

                if (!response.ok) {
                    throw new Error("Failed to load loans");
                }

                const loans = await response.json();

                tableBody.innerHTML = "";

                loans.forEach((loan) => {
                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${loan.id}</td>
                        <td>${escapeHtml(loan.borrower_name)}</td>
                        <td>${loan.loan_amount}</td>
                        <td>${escapeHtml(loan.property_city || "")}</td>
                        <td>${escapeHtml(loan.status)}</td>
                        <td>${escapeHtml(loan.served_by)}</td>
                    `;

                    tableBody.appendChild(row);
                });
            } catch (error) {
                message.textContent = error.message;
            }
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const payload = {
                borrower_name:
                    document.getElementById("borrower_name").value.trim(),

                loan_amount:
                    Number(document.getElementById("loan_amount").value),

                property_city:
                    document.getElementById("property_city").value.trim() || null,

                status:
                    document.getElementById("status").value
            };

            try {
                const response = await fetch(
                    `${API_BASE_URL}/loans`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(payload)
                    }
                );

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.detail || "Failed to create loan"
                    );
                }

                message.textContent =
                    `Loan ${result.id} created successfully.`;

                form.reset();

                await loadLoans();

            } catch (error) {
                message.textContent = error.message;
            }
        });

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        loadLoans();
    </script>
</body>
</html>
